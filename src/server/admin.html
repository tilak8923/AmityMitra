<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amizon — Admin</title>
    <style>
      :root {
        --bg: #0b0e16; --surface: #141926; --surface2: #1b2130; --border: #262d3f;
        --text: #e7eaf3; --muted: #8a93a8; --accent: #6b8afd; --accent-soft: rgba(107,138,253,.14);
        --good: #3ecf8e; --warn: #f5a623; --bad: #ef5f6b; --r: 12px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      a { color: var(--accent); }

      /* login */
      #login { max-width: 360px; margin: 12vh auto; padding: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
      #login h1 { font-size: 20px; margin: 0 0 4px; } #login h1 b { color: var(--accent); }
      #login p { color: var(--muted); margin: 0 0 18px; font-size: 13px; }

      /* app shell */
      #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
      aside { background: #0d1119; border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; }
      .brand { font-size: 18px; font-weight: 700; padding: 4px 10px 18px; } .brand b { color: var(--accent); }
      nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; color: var(--muted); border: 0; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; margin-bottom: 2px; }
      nav button:hover { background: var(--surface); color: var(--text); }
      nav button.active { background: var(--accent-soft); color: var(--text); }
      .sidefoot { margin-top: auto; font-size: 11px; color: var(--muted); padding: 10px; }

      main { padding: 22px 26px 60px; overflow: auto; }
      header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
      header.top h2 { margin: 0; font-size: 20px; font-weight: 700; }
      .badge { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
      .dot.off { background: var(--bad); }
      .lnk { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12.5px; }

      /* cards */
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
      .card h3 { margin: 0 0 14px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .grid { display: grid; gap: 16px; }
      .kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-bottom: 16px; }
      .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
      .kpi .v { font-size: 28px; font-weight: 700; line-height: 1; }
      .kpi .l { font-size: 12px; color: var(--muted); margin-top: 8px; }
      .two { grid-template-columns: 1.4fr 1fr; }
      @media (max-width: 820px) { #app { grid-template-columns: 1fr; } aside { flex-direction: row; overflow-x: auto; } .two { grid-template-columns: 1fr; } }

      /* chart */
      .bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; }
      .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; justify-content: flex-end; height: 100%; }
      .bar .col { width: 70%; max-width: 34px; background: linear-gradient(180deg, var(--accent), #4a6ae0); border-radius: 6px 6px 0 0; min-height: 3px; transition: height .3s; }
      .bar .cap { font-size: 10px; color: var(--muted); } .bar .num { font-size: 11px; font-weight: 600; }
      .hbar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
      .hbar .name { width: 92px; color: var(--muted); } .hbar .track { height: 8px; border-radius: 5px; background: var(--good); }

      /* table */
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; padding: 9px 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1px solid var(--border); }
      td { padding: 10px; border-bottom: 1px solid var(--border); }
      tr:last-child td { border-bottom: 0; }
      .chip { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; }
      .chip.free { color: var(--good); border-color: rgba(62,207,142,.35); } .chip.paid { color: var(--warn); border-color: rgba(245,166,35,.35); }
      .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
      .tag.on { color: var(--good); background: rgba(62,207,142,.12); } .tag.off { color: var(--muted); background: rgba(138,147,168,.12); }

      /* forms */
      label { font-size: 12px; color: var(--muted); display: block; margin: 12px 0 5px; }
      input, textarea, select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 9px 11px; font: inherit; }
      input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
      .btn { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
      .btn:hover { filter: brightness(1.08); }
      .btn.ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
      .msg { font-size: 12px; color: var(--muted); margin-top: 8px; }
      .hide { display: none !important; }
      .section-gap { margin-top: 16px; }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login">
      <h1>Amiz<b>on</b> Admin</h1>
      <p>Sign in to your control panel.</p>
      <label>Password</label>
      <input id="pw" type="password" placeholder="Admin password" />
      <div style="margin-top:16px"><button class="btn" id="loginBtn" style="width:100%">Sign in</button></div>
      <div class="msg" id="loginMsg"></div>
    </div>

    <!-- APP -->
    <div id="app" class="hide">
      <aside>
        <div class="brand">Amiz<b>on</b></div>
        <nav>
          <button data-view="overview" class="active">📊 Overview</button>
          <button data-view="users">👥 Users</button>
          <button data-view="money">💳 Monetization</button>
          <button data-view="broadcast">📢 Broadcast</button>
          <button data-view="settings">⚙️ Settings</button>
        </nav>
        <div class="sidefoot">Amizon Control Panel</div>
      </aside>

      <main>
        <header class="top">
          <h2 id="title">Overview</h2>
          <div class="row" style="align-items:center">
            <span class="badge"><span class="dot" id="botDot"></span><span id="botTxt">bot</span></span>
            <button class="lnk" id="refreshBtn">↻ Refresh</button>
            <button class="lnk" id="logoutBtn">Sign out</button>
          </div>
        </header>

        <!-- OVERVIEW -->
        <section id="view-overview">
          <div class="grid kpis" id="kpis"></div>
          <div class="grid two">
            <div class="card">
              <h3>New connections · last 7 days</h3>
              <div class="bars" id="growth"></div>
            </div>
            <div class="card">
              <h3>Most-used commands</h3>
              <div id="commands"></div>
            </div>
          </div>
        </section>

        <!-- USERS -->
        <section id="view-users" class="hide">
          <div class="card">
            <h3>Users</h3>
            <input id="search" placeholder="Search by name or enrollment id…" style="max-width:320px;margin-bottom:12px" />
            <div style="overflow:auto">
              <table>
                <thead><tr><th>Enrollment</th><th>Name</th><th>Plan</th><th>Last sync</th><th>Syncs</th></tr></thead>
                <tbody id="users"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- MONETIZATION -->
        <section id="view-money" class="hide">
          <div class="grid two">
            <div class="card">
              <h3>Features — free / paid</h3>
              <div id="features"></div>
            </div>
            <div class="card">
              <h3>Pricing (₹)</h3>
              <div class="row">
                <div style="flex:1"><label>Per month</label><input id="priceM" /></div>
                <div style="flex:1"><label>Per year</label><input id="priceY" /></div>
              </div>
              <div class="section-gap"><button class="btn" id="savePricing">Save pricing</button> <span class="msg" id="priceMsg"></span></div>
            </div>
          </div>
        </section>

        <!-- BROADCAST -->
        <section id="view-broadcast" class="hide">
          <div class="card" style="max-width:560px">
            <h3>Broadcast a message</h3>
            <textarea id="bcast" rows="3" placeholder="Urgent: TCS drive just opened — apply by 6 PM!"></textarea>
            <div class="row section-gap">
              <div><label>Audience</label>
                <select id="segment" style="width:auto">
                  <option value="all">All connected</option>
                  <option value="paid">Paid only</option>
                  <option value="free">Free only</option>
                  <option value="inactive">Inactive (24h+)</option>
                </select>
              </div>
              <div style="align-self:flex-end"><button class="btn" id="bcastBtn">Send</button></div>
              <div style="align-self:flex-end" class="msg" id="bcastMsg"></div>
            </div>
          </div>
        </section>

        <!-- SETTINGS -->
        <section id="view-settings" class="hide">
          <div class="card" style="max-width:640px">
            <h3>Bot &amp; schedule</h3>
            <div class="row">
              <div style="flex:1;min-width:200px"><label>Bot token (blank = keep current)</label><input id="botToken" placeholder="from @BotFather" /></div>
              <div style="width:180px"><label>Bot username (no @)</label><input id="botUsername" placeholder="AmityMitra_bot" /></div>
            </div>
            <div class="row section-gap">
              <div style="width:170px"><label>Morning schedule (cron)</label><input id="morningCron" /></div>
              <div style="width:170px"><label>Timezone</label><input id="timezone" /></div>
            </div>
            <div class="section-gap"><button class="btn" id="saveCfg">Save settings</button> <span class="msg" id="cfgMsg"></span></div>
          </div>
        </section>
      </main>
    </div>

    <script>
      let PW = '';
      const $ = (id) => document.getElementById(id);
      const api = (path, body) =>
        fetch(path, {
          method: body ? 'POST' : 'GET',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + PW },
          body: body ? JSON.stringify(body) : undefined,
        }).then((r) => r.json().then((j) => ({ ok: r.ok, j })).catch(() => ({ ok: r.ok, j: {} })));

      const agoT = (t) => {
        if (!t) return 'never';
        const m = Math.round((Date.now() - t) / 60000);
        if (m < 60) return m + 'm ago';
        const h = Math.round(m / 60);
        return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
      };

      // login
      $('loginBtn').onclick = async () => {
        PW = $('pw').value;
        const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: PW }) });
        if (!r.ok) { $('loginMsg').textContent = 'Wrong password.'; return; }
        $('login').classList.add('hide'); $('app').classList.remove('hide'); load();
      };
      $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
      $('logoutBtn').onclick = () => { PW = ''; $('app').classList.add('hide'); $('login').classList.remove('hide'); };
      $('refreshBtn').onclick = () => load();

      // nav
      const VIEWS = ['overview', 'users', 'money', 'broadcast', 'settings'];
      const TITLES = { overview: 'Overview', users: 'Users', money: 'Monetization', broadcast: 'Broadcast', settings: 'Settings' };
      document.querySelectorAll('nav button').forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active'));
          b.classList.add('active');
          const v = b.dataset.view;
          VIEWS.forEach((name) => $('view-' + name).classList.toggle('hide', name !== v));
          $('title').textContent = TITLES[v];
        };
      });

      let ALL_USERS = [];

      async function load() {
        const { ok, j } = await api('/api/admin/state');
        if (!ok) { $('app').classList.add('hide'); $('login').classList.remove('hide'); return; }
        const s = j.stats;

        $('botDot').className = 'dot' + (j.botRunning ? '' : ' off');
        $('botTxt').textContent = j.botRunning ? 'bot online' : 'bot offline';

        $('kpis').innerHTML = [
          ['Total users', s.total], ['Connected', s.connected], ['Active 24h', s.active24h],
          ['Syncs today', s.syncsToday], ['Paid', s.paid], ['Stale sessions', s.staleSessions],
        ].map(([l, v]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');

        const a = j.analytics;
        const max = Math.max(1, ...a.connectsByDay.map((d) => d.count));
        $('growth').innerHTML = a.connectsByDay.map((d) =>
          `<div class="bar"><div class="num">${d.count || ''}</div><div class="col" style="height:${Math.round((d.count / max) * 118)}px"></div><div class="cap">${d.day.slice(5)}</div></div>`
        ).join('');
        $('commands').innerHTML = a.topCommands.length
          ? a.topCommands.map((c) => `<div class="hbar"><div class="name">/${c.cmd}</div><div class="track" style="width:${Math.max(18, c.count * 26)}px"></div><div class="msg" style="margin:0">${c.count}</div></div>`).join('')
          : '<div class="msg">No usage yet.</div>';

        ALL_USERS = j.users; renderUsers();

        $('features').innerHTML = j.config.features.map((f) =>
          `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px"><div>${f.label}</div>
           <span class="chip ${f.tier}" data-key="${f.key}" data-tier="${f.tier === 'free' ? 'paid' : 'free'}">${f.tier} · make ${f.tier === 'free' ? 'paid' : 'free'}</span></div>`
        ).join('');
        document.querySelectorAll('#features .chip').forEach((el) => {
          el.onclick = async () => { await api('/api/admin/feature', { key: el.dataset.key, tier: el.dataset.tier }); load(); };
        });

        $('priceM').value = j.config.pricing.monthly;
        $('priceY').value = j.config.pricing.yearly;
        $('morningCron').value = j.config.morningCron;
        $('timezone').value = j.config.timezone;
        $('botToken').placeholder = j.config.botTokenMasked;
        $('botUsername').value = (j.config.botUsername || '').replace('(set botUsername)', '');
      }

      function renderUsers() {
        const q = ($('search').value || '').toLowerCase();
        const rows = ALL_USERS.filter((u) => !q || (u.name || '').toLowerCase().includes(q) || (u.amizoneId || '').toLowerCase().includes(q));
        $('users').innerHTML = rows.map((u) =>
          `<tr>
             <td>${u.amizoneId || '—'} ${u.stale ? '<span class="tag off">stale</span>' : ''}</td>
             <td>${u.name || '—'}</td>
             <td><span class="chip ${u.plan}" data-chat="${u.chatId}" data-plan="${u.plan === 'free' ? 'paid' : 'free'}">${u.plan}</span></td>
             <td>${u.connected ? `<span class="tag on">${agoT(u.lastSyncAt)}</span>` : '<span class="tag off">no data</span>'}</td>
             <td>${u.syncCount || 0}</td>
           </tr>`
        ).join('') || '<tr><td colspan="5" class="msg">No users yet.</td></tr>';
        document.querySelectorAll('#users .chip').forEach((el) => {
          el.onclick = async () => { await api('/api/admin/user/plan', { chatId: +el.dataset.chat, plan: el.dataset.plan }); load(); };
        });
      }
      $('search').addEventListener('input', renderUsers);

      $('savePricing').onclick = async () => {
        await api('/api/admin/config', { pricing: { monthly: +$('priceM').value, yearly: +$('priceY').value } });
        $('priceMsg').textContent = 'Saved.';
      };
      $('saveCfg').onclick = async () => {
        const body = { morningCron: $('morningCron').value, timezone: $('timezone').value, botUsername: $('botUsername').value.trim() };
        if ($('botToken').value.trim()) body.botToken = $('botToken').value.trim();
        const { j } = await api('/api/admin/config', body);
        $('cfgMsg').textContent = j.note || 'Saved.'; $('botToken').value = '';
      };
      $('bcastBtn').onclick = async () => {
        const text = $('bcast').value.trim(); if (!text) return;
        const { j } = await api('/api/admin/broadcast', { text, segment: $('segment').value });
        $('bcastMsg').textContent = `Sent to ${j.sent} of ${j.targeted}.`; $('bcast').value = '';
      };
    </script>
  </body>
</html>
